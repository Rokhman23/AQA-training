plugins {
    id 'base'
    id 'io.qameta.allure-report' version '4.3.0'
}

allprojects {
    repositories {
        mavenCentral()
    }
}

subprojects {
    configurations {
        aspectjAgent
    }

    dependencies {
        aspectjAgent 'org.aspectj:aspectjweaver:1.9.25.1'
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        outputs.upToDateWhen { false }
        jvmArgs "-javaagent:${configurations.aspectjAgent.singleFile}"
        jvmArgs '-Dfile.encoding=UTF-8'
    }
}

allure {
    version = '2.42.1'
}

dependencies {
    allureReport(files(rootProject.project(':api-tests').layout.buildDirectory.dir('allure-results')))
    allureReport(files(rootProject.project(':ui-tests').layout.buildDirectory.dir('allure-results')))
}

tasks.register('smokeApi') {
    group = 'verification'
    description = 'Runs API smoke tests.'
    dependsOn ':api-tests:smokeTest'
}

tasks.register('smokeUi') {
    group = 'verification'
    description = 'Runs UI smoke tests.'
    dependsOn ':ui-tests:smokeTest'
}

tasks.register('smoke') {
    group = 'verification'
    description = 'Runs API and UI smoke tests.'
    dependsOn tasks.named('smokeApi'), tasks.named('smokeUi')
}

tasks.register('runAllTests') {
    group = 'verification'
    description = 'Runs tests in all project modules.'
    dependsOn subprojects.collect { it.tasks.named('test') }
}

tasks.register('afterTests') {
    group = 'verification'
    description = 'Runs all tests and prints a completion message.'
    dependsOn tasks.named('runAllTests')
    doLast {
        println 'Test run is over'
    }
}

tasks.named('allureReport') {
    doFirst {
        delete(layout.buildDirectory.dir('reports/allure-report/allureReport'))
    }
}

tasks.register('allureReportArchive', Zip) {
    group = 'verification'
    description = 'Packages the generated Allure HTML report as a ZIP archive.'
    dependsOn tasks.named('allureReport')
    from layout.buildDirectory.dir('reports/allure-report/allureReport')
    archiveFileName = 'allure-report.zip'
    destinationDirectory = layout.buildDirectory.dir('reports')
}
